<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse · Lunette</title>
  <meta name="description" content="Explora tops, faldas, hoodies, accesorios, bolsos y outfits Y2K de Lunette en Guatemala.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎀</text></svg>">
  <link rel="stylesheet" href="css/y2k.css">
</head>
<body data-page="browse">
  <div class="site-shell">
    <div class="browser-window">
      <div data-chrome="windowbar"></div>
      <div data-chrome="header"></div>

      <div class="layout">
        <div data-chrome="sidebar"></div>

        <main class="main-content">
          <section class="page-hero">
            <h1 id="browseTitle">Browse Collection</h1>
            <p>Find your perfect Y2K style — filtra, explora y enamórate ₊˚⊹</p>
          </section>

          <div class="toolbar">
            <label class="search-field">
              <span aria-hidden="true">🔍</span>
              <input type="search" id="browseSearch" placeholder="Buscar tops, faldas, bolsos…" aria-label="Buscar productos">
            </label>
            <select class="select-pill" id="browseSort" aria-label="Ordenar productos">
              <option value="featured">Destacados</option>
              <option value="newest">Más nuevos</option>
              <option value="price-asc">Menor precio</option>
              <option value="price-desc">Mayor precio</option>
              <option value="rating">Mejor valorados</option>
              <option value="name">Nombre A-Z</option>
            </select>
          </div>

          <div class="chip-row" id="categoryChips" aria-label="Filtrar por categoría"></div>
          <div class="chip-row" id="badgeChips" aria-label="Filtrar por etiqueta"></div>

          <div class="results-meta">
            <span id="browseCount">0 productos</span>
            <a class="link-more" href="browse.html">limpiar filtros ✕</a>
          </div>

          <div class="product-grid" id="browseGrid"></div>
        </main>
      </div>

      <div data-chrome="footer"></div>
    </div>
  </div>

  <div data-chrome="drawer"></div>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/components.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
