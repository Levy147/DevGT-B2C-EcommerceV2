<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search · Lunette</title>
  <meta name="description" content="Busca productos Y2K y coquette en Lunette Guatemala.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎀</text></svg>">
  <link rel="stylesheet" href="css/y2k.css">
</head>
<body data-page="search">
  <div class="site-shell">
    <div class="browser-window">
      <div data-chrome="windowbar"></div>
      <div data-chrome="header"></div>

      <div class="layout">
        <div data-chrome="sidebar"></div>

        <main class="main-content">
          <section class="page-hero">
            <h1>Search</h1>
            <p>Encuentra tu próxima obsesión: tops, faldas, bolsos y más ✦</p>
            <label class="search-field" style="margin-top:16px;">
              <span aria-hidden="true">🔍</span>
              <input type="search" id="searchInput" placeholder="Escribe lo que buscas, Bunny…" aria-label="Buscar productos">
            </label>
          </section>

          <div class="results-meta">
            <span id="searchCount">Populares ahora</span>
            <a class="link-more" href="browse.html">ver catálogo completo →</a>
          </div>

          <div class="product-grid" id="searchResults"></div>
        </main>
      </div>

      <div data-chrome="footer"></div>
    </div>
  </div>

  <div data-chrome="drawer"></div>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/components.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
